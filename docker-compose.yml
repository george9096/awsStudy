name: awsstudy

# 백엔드 + 의존성(PostgreSQL, Redis) 만 컨테이너로 띄움.
# 프론트엔드는 호스트에서 'npm run dev' 로 띄움 (vite dev server, 5173 포트).
# vite.config.js 의 proxy 설정이 /api → http://localhost:8080 으로 자동 전달.

services:
  postgres:
    image: postgres:17-alpine
    container_name: awsstudy-postgres
    environment:
      POSTGRES_DB: awsstudy
      POSTGRES_USER: awsstudy
      POSTGRES_PASSWORD: awsstudy
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awsstudy -d awsstudy"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: awsstudy-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: awsstudy-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/awsstudy
      DB_USERNAME: awsstudy
      DB_PASSWORD: awsstudy
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

volumes:
  pg-data:
  redis-data:
