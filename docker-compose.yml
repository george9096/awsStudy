name: awsstudy

services:
  postgres:
    image: postgres:17-alpine
    container_name: awsstudy-postgres
    environment:
      POSTGRES_DB: awsstudy
      POSTGRES_USER: awsstudy
      POSTGRES_PASSWORD: awsstudy
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awsstudy -d awsstudy"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: awsstudy-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: awsstudy-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/awsstudy
      DB_USERNAME: awsstudy
      DB_PASSWORD: awsstudy
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  frontend:
    build: ./frontend
    container_name: awsstudy-frontend
    depends_on:
      - backend
    environment:
      BACKEND_HOST: backend
    ports:
      - "8081:80"

volumes:
  pg-data:
  redis-data:
