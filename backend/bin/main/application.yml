server:
  port: 8080

spring:
  application:
    name: awsstudy-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/awsstudy}
    username: ${DB_USERNAME:awsstudy}
    password: ${DB_PASSWORD:awsstudy}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s
      ssl:
        enabled: ${REDIS_SSL:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
